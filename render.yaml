# render.yaml sample - create two services (Backend + Frontend)

services:
  - type: web
    name: lamalavista-backend
    env: python
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT --workers 4
    repo: https://github.com/kayefande-droid/lamalavista
    branch: init/lamalavista

  - type: static
    name: lamalavista-frontend
    env: static
    region: oregon
    buildCommand: cd frontend && npm ci && npm run build
    publishPath: frontend/build
    repo: https://github.com/kayefande-droid/lamalavista
    branch: init/lamalavista
